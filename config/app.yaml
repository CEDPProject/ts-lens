# ──────────────────────────────────────────────────────────────
# Application Global Settings
# ──────────────────────────────────────────────────────────────
#
# Constants and defaults shared across helpers.py, preprocessing.py,
# segment_search.py, app.py, etc. are collected here.
# search.yaml and text_ts.yaml are kept separate for clarity of purpose.
# ──────────────────────────────────────────────────────────────


# ── App Basics ─────────────────────────────────────────────────
# secret_key는 yaml에 두지 않음 — 환경변수 TS_PATTERN_SECRET_KEY 로 주입.
# 미설정 시 실행마다 임의 생성 (재시작하면 세션 쿠키 무효).
app:
  host: "0.0.0.0"             # Bind address for `python3 app.py`
  port: 7000                  # Server port
  # 자매 도구 링크(화면 우상단). 같은 호스트에 다른 도구가 있을 때만 채운다.
  # name 이 비어 있으면 링크를 그리지 않는다.
  sibling:
    name: ''                    # 표시 이름. 문자열 또는 언어별 사전 {ko: ..., en: ...}
    # 접속한 주소의 호스트를 그대로 쓰고 포트만 바꾼다. IP가 달라져도 따라간다
    port: 7100
    # 다른 장비에 있으면 여기에 절대 주소를 적는다. 적으면 port 는 무시된다
    url:


# ── Display / Preview ─────────────────────────────────────────
display:
  max_points: 50000           # Max points to display on chart
  preview_limit: 100          # Number of rows for source preview
  sources_preview_count: 10   # Number of source previews in dataset list


# ── Segment Settings ─────────────────────────────────────────
segment:
  default_length: 24          # Default segment length (points)
  min_length: 3               # Minimum segment length
  gap_size_default: 10        # Default gap size for concat
  gap_size_min: 1
  gap_size_max: 100


# ── Sampling Detection ───────────────────────────────────────
detection:
  sampling_sample_size: 50    # Sample size for sampling interval detection
  interval_sample_size: 20    # Sample size for data interval detection
  date_parse_confidence: 0.7  # Date parsing confidence threshold
  default_sampling_minutes: 60  # Fallback sampling interval (minutes)


# ── Preprocessing ────────────────────────────────────────────
preprocessing:
  gap_detection_multiplier: 1.5   # Gap detection multiplier (interval * this)
  max_insertable_points: 100000   # Max insertable points for gap interpolation
  outlier_iqr_k: 3.0              # IQR outlier k multiplier
  outlier_percentile_bounds: [0.1, 10.0]  # Percentile bounds
  nan_override_ratio: 0.9         # NaN ratio limit when applying value range
  default_interpolation: adaptive  # Default interpolation method
  adaptive_threshold: 10          # Gaps > this use MOMENT, else linear
  max_gap_size: 100               # Gaps > this are left as NaN (not interpolated)
  interpolation_methods:
    - key: adaptive
      label: "Adaptive (Recommended)"
      description: "Short gaps (<=10): linear, Medium gaps (11-100): MOMENT, Very long (>100): skip"
    - key: linear
      label: "Linear"
      description: "Connect adjacent values with straight line"
    - key: cubic
      label: "Cubic Spline"
      description: "Smooth curve interpolation (suitable for temperature, etc.)"
    - key: spline
      label: "Smoothing Spline"
      description: "Smooth out noisy data"
    - key: zero
      label: "Zero Fill"
      description: "Fill missing values with 0"
    - key: moment
      label: "MOMENT (FM)"
      description: "Foundation model zero-shot imputation (context-aware)"
  # MOMENT 모델 ID/device 는 config/model/foundation.yaml 에서 설정 (moment 섹션).


# ── CSV Upload ────────────────────────────────────────────────
csv:
  min_rows: 10                # Minimum number of rows
  session_id_length: 8        # Session ID length
  batch_size: 5000            # DB batch insert size

  # 업로드 한 건의 최대 크기. 초과하면 413 으로 끊는다.
  max_upload_mb: 512
  # 미리보기에 실어 보내는 표본 행 수
  preview_rows: 5

  # ── 인코딩 ──────────────────────────────────────────────────
  # 위에서부터 엄격 해독을 시도하고, 성공한 것 중 글자 점수가 가장 높은 것을 쓴다.
  # BOM 이 있으면 후보를 보지 않고 BOM 이 가리키는 인코딩으로 확정한다.
  # latin-1 은 어떤 바이트든 통과하므로 반드시 맨 끝에 둔다(최후 수단).
  encoding_candidates: ["utf-8", "cp949", "euc-kr", "utf-16", "latin-1"]
  # 해독 결과 중 이 비율 미만이 '읽을 만한 글자'면 깨진 것으로 보고 다음 후보로 넘어간다
  encoding_min_score: 0.98

  # ── 구분자 ──────────────────────────────────────────────────
  # 앞부분 몇 줄을 후보별로 실제 파싱해, 열 수가 일정하고 가장 많이 쪼개지는 것을 고른다
  delimiter_candidates: [",", "\t", ";", "|"]
  delimiter_sample_lines: 20

  # ── 결측 표기 ───────────────────────────────────────────────
  # pandas 기본값에 더해 결측으로 볼 문자열
  na_values: ["-", "--", "N/A", "n/a", "없음", "결측", "미측정", "?", "NULL", "null"]

  # ── 숫자 복원 ───────────────────────────────────────────────
  # "1,234" 처럼 천단위 쉼표가 낀 열을 숫자로 되살린다.
  # 세 자리씩 묶인 것만 천단위로 본다 -- "0,5" 를 5 로 만들면 값이 10배 틀어진다.
  recover_thousands: true
  # 유럽식 소수점 쉼표("12,5" = 12.5) 처리.
  #   auto  : 구분자가 쉼표가 아니고 자릿수가 천단위 묶음이 아닐 때만 소수점으로 (기본)
  #   true  : 항상 소수점으로   false : 쓰지 않음
  decimal_comma: "auto"
  # 표본에서 이 비율 이상이 숫자 모양이면 숫자열로 본다
  numeric_recover_ratio: 0.95

  # ── 시각 열 ─────────────────────────────────────────────────
  time:
    # 1/2/2024 를 2월 1일로 읽을지(true) 1월 2일로 읽을지(false).
    # 한국·미국 자료는 false(월 먼저)가 맞고, 유럽 자료는 true 로 바꾼다.
    dayfirst: false
    # 해독 실패(NaT) 비율이 이보다 크면 시각 열로 인정하지 않고 거부한다
    max_unparsed_ratio: 0.10
    # 저장 형식. 문자열 정렬 = 시간 정렬이 되도록 ISO 로 고정한다.
    # 전 행이 자정이면 date_format, 아니면 datetime_format 을 쓴다.
    date_format: "%Y-%m-%d"
    datetime_format: "%Y-%m-%d %H:%M:%S"
    # 숫자 인덱스에 음수가 섞였을 때. 저장은 문자열이라 -1 이 -10 보다 앞서
    # 순서가 뒤집힌다.
    #   reject : 저장을 막고 알려준다 (기본)
    #   offset : 최솟값이 0 이 되게 전체를 옮기고, 옮긴 양을 메타에 남긴다
    negative_index: "reject"

  # ── 중복 타임스탬프 ─────────────────────────────────────────
  # error : 저장을 막고 중복된 시각을 알려준다 (기본)
  # first : 첫 값만 남김        last : 마지막 값만 남김
  # mean  : 평균으로 합침       shift: 샘플링 간격만큼 뒤로 밀어 전부 살림
  duplicate_policy: "error"
  # 거부·보고 시 화면에 보여줄 중복 시각 예시 개수
  duplicate_report_limit: 5
  duplicate_uniform_share: 0.95    # 중복 시각의 이 비율 이상이 같은 횟수 k면 '파일 k개를 합친 것' 으로 진단

  # ── 내보내기 ────────────────────────────────────────────────
  # 엑셀은 BOM 이 없으면 UTF-8 을 못 알아보고 한글을 깬다. 끄면 순수 UTF-8.
  export_bom: true


# ── Benchmark Import ─────────────────────────────────────────
# 공개 벤치마크 저장소. 주소가 바뀌면 여기만 고친다.
benchmark:
  skab:
    repo: https://github.com/waico/SKAB.git
    home: https://github.com/waico/SKAB
  nab:
    repo: https://github.com/numenta/NAB.git
    home: https://github.com/numenta/NAB

# ── Session / Cache ──────────────────────────────────────────
session:
  max_entries: 50             # 메모리에 들고 있는 로드 세션 수
cache:
  cluster_max_entries: 10     # 군집 결과 캐시 개수
llm:
  reachability_ttl_sec: 30.0  # LLM 서버 도달 여부를 다시 확인하기까지의 시간(초)
  describe_max_tokens: 1500   # 구간 설명 출력 상한. 한·영 두 벌 JSON 이라 768 로는 잘려 파싱이 깨졌다(10-07)

# ── Periodicity Analysis ─────────────────────────────────────
periodicity:
  min_data_length: 48         # Minimum data length for FFT analysis
  min_repeats: 2              # A period must repeat at least this many times within the series
  fft_peak_height: 0.1        # Minimum height for peak detection
  fft_peak_distance_ratio: 0.01  # Minimum distance ratio between peaks
  strength_threshold: 0.15    # Periodicity significance threshold


# ── Time Unit Definitions ────────────────────────────────────
# Referenced commonly by preprocessing.py, segment_search.py, etc.
time_units:
  hour:
    minutes: 60
    label: "1 hour"
  6hour:
    minutes: 360
    label: "6 hours"
  day:
    minutes: 1440
    label: "1 day"
  week:
    minutes: 10080
    label: "1 week"
  month:
    minutes: 43200
    label: "1 month"
  year:
    minutes: 525600
    label: "1 year"


# ── Preset Shapes ────────────────────────────────────────────
preset_shapes:
  generation_resolution: 48   # Preset generation resolution (before resampling)
  preview_length: 24          # UI preview length
  classify_min_similarity: 0.5  # Segments below this threshold → "Unclassified"
  catalog:
    rise:
      label: "Rise"
      icon: "trending_up"
    fall:
      label: "Decline"
      icon: "trending_down"
    flat:
      label: "Flat"
      icon: "horizontal_rule"
    bell:
      label: "Bell"
      icon: "show_chart"
    v_shape:
      label: "V-shape"
      icon: "expand_more"
    spike:
      label: "Spike"
      icon: "bolt"
    dip:
      label: "Dip"
      icon: "arrow_downward"


# ── Clustering Settings ──────────────────────────────────────
clustering:
  jobs:
    max_active: 2
    max_retained: 16
    retention_seconds: 1800
    max_messages: 256
  default_algorithm: kmeans
  default_method: preset        # Distance: preset, euclidean, cosine, shape
  normalize: true

  # K-Means with Auto-K
  kmeans:
    k_min: 2
    k_max: 15
    n_init: 10                  # Number of initializations
    random_state: 42
    auto_k_strategy: multi_index  # silhouette, multi_index, elbow
    max_subsample: 500          # Subsample for speed in Auto-K

  # k-Shape (shape-based clustering for time series)
  kshape:
    k_min: 2
    k_max: 15
    max_iter: 100

  # MOMENT Embedding (foundation model-based)
  # 모델 ID / device 는 config/model/foundation.yaml 의 moment 섹션에서 설정.
  moment:
    k_min: 2
    k_max: 15

  # Auto-K multi-index weights (Silhouette coefficient, Calinski-Harabasz index, Davies-Bouldin index)
  auto_k:
    weights: [1.0, 1.0, 1.0]    # Equal weight by default

  # Segment subdivision (/api/segment_search/subdivide)
  subdivide_k: 3                # Default number of sub-clusters

  # Medoid centroid settings
  medoid:
    enabled: true               # Use medoid (actual member) instead of mean


# ── Time Column Auto-Detection Scoring ───────────────────────
column_detection:
  time_exact_score: 100
  time_substring_score: 50
  index_exact_score: 80
  index_substring_score: 40
  non_numeric_bonus: 10
  datetime_detected_bonus: 30
  monotonic_bonus: 20
  first_column_bonus: 5
  min_detection_score: 10
  time_exact_keywords:
    - datetime
    - timestamp
    - date
    - time
    - dt
    - ts
    - "date"
    - "time"
    - "datetime"
    - "measurement_time"
    - "observation_time"
    - date_time
  time_substring_keywords:
    - datetime
    - timestamp
    - date_time
    - "measurement_time"
    - "observation_time"
    - "datetime"
  index_exact_keywords:
    - id
    - "no"
    - index
    - idx
    - step
    - batch
    - sample
    - "number"
    - "sequence"
    - "batch"
    - "step"
    - "sample"
    - run
    - cycle
  index_substring_keywords:
    - _no
    - _id
    - _idx
    - batch
    - step
    - sample
    - "number"
    - "sequence"
    - "index"

# ── 로그인 ─────────────────────────────────────────────────────
# 계정 파일이 없으면 로그인 없이 연다(개방 모드). 계정은 tools/set_password.py 로 넣는다.
auth:
  users_file: config/local/users.yaml   # git 밖. 환경변수 TS_PATTERN_USERS_FILE 이 있으면 그것이 우선
  session_hours: 72                     # 로그인 유지 시간

# ── 외부 LLM 연결 ────────────────────────────────────────────
# 제공자·모델·키는 관리자가 화면(데이터 관리 → 모델 연결)에서 넣고 아래 파일에 저장된다(git 밖, 600).
# 여기에는 호출 기본값만 둔다.
external_llm:
  file: config/local/external_llm.json
  anthropic_base_url: https://api.anthropic.com
  timeout: 120
  health_timeout: 5
  max_tokens: 2048
  min_output_tokens: 2048            # Claude 5세대는 생각 토큰이 상한에 포함돼 작은 상한이면 빈 답이 온다
  temperature: 0.2
  meta_inference_prompt_rows: 20     # 메타 추정에 보낼 표본 행 수
  meta_inference_max_tokens: 6000    # 메타 추정 답(칸별 설명 JSON)은 길다 — 생각 토큰까지 포함한 상한, 잘리면 안쪽 조각을 집어 엉뚱한 칸이 채워진다
  meta_inference_max_files: 12       # 폴더 업로드에서 AI 메타 추정에 보내는 파일 수 상한(각 파일 요약·표본 행이 프롬프트에 들어감)
  usage_file: config/local/external_llm_usage.json   # 월별 호출 수·토큰·추정 비용(USD). 경고·한도는 모델 연결 탭에서
  default_monthly_warn_usd: 10
  default_monthly_limit_usd: 100
  # 추정 단가(USD / 100만 토큰). 모델 이름 앞머리로 맞춘다. 없는 모델은 default. 실제 청구는 콘솔이 정본.
  prices:
    claude-opus-5-5:   {input: 4.0,  output: 20.0}
    claude-opus-5:     {input: 5.0,  output: 25.0}
    claude-sonnet-5-5: {input: 2.0,  output: 10.0}
    claude-sonnet-5:   {input: 2.0,  output: 10.0}
    claude-haiku-4-5:  {input: 1.0,  output: 5.0}
    claude-fable-5:    {input: 10.0, output: 50.0}
    default:           {input: 5.0,  output: 25.0}
