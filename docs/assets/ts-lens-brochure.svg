<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">TS-Lens — 시계열에서 패턴을 찾고, 검토하고, 기록합니다</title>
<desc id="desc">CSV 등록, 다섯 가지 질의, 수치 기반 유사 검색, Label Basket 검토의 네 단계. 기본 분석은 CPU에서 동작하며 AI 기능은 모델별 GPU 또는 CPU 실행 환경과 가중치가 필요합니다. 실제 화면이 아닌 기능 흐름도입니다.</desc>
